<script>
    function setGiscusTheme(theme) {
        let giscus = document.querySelector("iframe.giscus-frame");
        if (giscus) {
            giscus.contentWindow.postMessage(
                {
                    giscus: {
                        setConfig: {
                            theme: theme,
                        },
                    },
                },
                "https://giscus.app"
            );
        }
    }

    (function () {
        addEventListener("message", (e) => {
            if (e.origin !== "https://giscus.app") return;
            handler();
        });
        window.addEventListener("onColorSchemeChange", handler);

        function handler() {
            if (document.documentElement.dataset.scheme === "light") {
                setGiscusTheme('light');
            } else {
                setGiscusTheme('dark_dimmed');
            }
        }
    })();
</script>

<button id="live2d-launcher" type="button" aria-label="点击加载看板娘">看板娘</button>
<div id="particles-js" aria-hidden="true"></div>
<link rel="stylesheet" href="https://xxl999227.github.io/background/particles/style.css">
<script>
(function () {
    const waifuCss = "https://xxl999227.github.io/waifu/waifu.css";
    const tipsPath = "https://xxl999227.github.io/waifu/waifu-tips.json";
    const widgetScript = "https://xxl999227.github.io/waifu/my-waifu-tips.js";
    const modelScript = "https://xxl999227.github.io/waifu/live2d.min.js";
    const gamePath = "https://xxl999227.github.io/waifu/asteroids.js";
    const particlesScript = "https://xxl999227.github.io/background/particles/particles.js";
    const particlesConfig = "https://xxl999227.github.io/background/particles/particlesjs-config.json";
    const launcher = document.getElementById("live2d-launcher");

    function loadResource(url, type) {
        return new Promise((resolve, reject) => {
            const element = document.createElement(type === "css" ? "link" : "script");
            if (type === "css") {
                element.rel = "stylesheet";
                element.href = url;
            } else {
                element.src = url;
                element.async = true;
            }
            element.onload = resolve;
            element.onerror = () => reject(new Error("无法加载资源: " + url));
            document.head.appendChild(element);
        });
    }

    // Live2D 只在点击后加载，避免阻塞页面并减少常驻动画开销。
    if (window.innerWidth < 768) {
        launcher.hidden = true;
    } else {
        launcher.addEventListener("click", async () => {
            if (launcher.disabled) return;
            launcher.disabled = true;
            launcher.textContent = "加载中…";
            try {
                await loadResource(waifuCss, "css");
                await loadResource(modelScript, "js");
                await loadResource(widgetScript, "js");
                initWidget({
                    waifuPath: tipsPath,
                    gamePath: gamePath,
                    cdnPath: "https://cdn.jsdelivr.net/gh/XXL999227/static-resource@v1.0.0",
                    tools: ["hitokoto", "asteroids", "switch-model", "switch-texture", "photo", "quit"]
                });
                launcher.remove();
            } catch (error) {
                console.error("看板娘资源加载失败:", error);
                launcher.disabled = false;
                launcher.textContent = "重试看板娘";
            }
        });
    }

    // 仅宽屏非减少动效模式才加载静态粒子背景，且在空闲时初始化。
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (window.innerWidth >= 900 && !reducedMotion) {
        const start = () => {
            loadResource(particlesScript, "js").then(() => {
                if (!document.hidden && window.particlesJS) {
                    particlesJS.load("particles-js", particlesConfig);
                }
            }).catch(error => console.warn("粒子背景加载失败:", error));
        };
        if ("requestIdleCallback" in window) {
            window.requestIdleCallback(start, { timeout: 3500 });
        } else {
            setTimeout(start, 1800);
        }
    }
})();
</script>
